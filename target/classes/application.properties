# Display name for this Spring Boot application
spring.application.name=user-api

# --- H2 In-Memory Database Configuration ---
# jdbc:h2:mem:userdb creates a temporary database called "userdb" that lives
# entirely in RAM. It is fast but all data is lost when the application stops.
spring.datasource.url=jdbc:h2:mem:userdb

# Tells Spring which JDBC driver class to use to connect to the database.
# org.h2.Driver is the driver provided by the H2 dependency in pom.xml.
spring.datasource.driver-class-name=org.h2.Driver

# "create-drop" means Hibernate will:
#   1. CREATE all database tables on startup (based on @Entity classes)
#   2. DROP all tables when the application shuts down
# Other options: "update" (keep data between restarts), "validate" (only check schema), "none"
spring.jpa.hibernate.ddl-auto=create-drop

# Enables the H2 web console UI at http://localhost:8080/h2-console
# Useful for inspecting the database manually during development.
spring.h2.console.enabled=true
